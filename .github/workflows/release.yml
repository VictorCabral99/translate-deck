name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Build frontend
        working-directory: plugin
        run: npm ci && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: |
          python -m pip install -e core pytest
          python -m pytest -q
      - name: Empacotar
        run: |
          python plugin/scripts/build.py --edition store
          python plugin/scripts/build.py --edition sideload
          (unzip -l out/store.zip | grep -i manual) && exit 1 || true
      - name: Publicar assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/store.zip
            out/sideload.zip
          body: |
            Build automatica da tag ${{ github.ref_name }}.

            - `store.zip`: build para a loja Decky (sem fonte manual).
            - `sideload.zip`: build completa (inclui fonte manual).
